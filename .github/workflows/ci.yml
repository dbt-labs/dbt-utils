# **what?**
# Run tests for dbt-utils against supported adapters

# **why?**
# To ensure that dbt-utils works as expected with all supported adapters

# **when?**
# On every PR, and every push to main and when manually triggered

name: Package Integration Tests

on:
    push:
        branches:
            - main
    pull_request_target:
    workflow_dispatch:


# Least privilege for the GITHUB_TOKEN. The integration tests do not need to write to the repo.
permissions:
  contents: read

jobs:
  run-tests:
      uses: dbt-labs/dbt-package-testing/.github/workflows/run_tox.yml@v2
      with:
        # SECURITY: pull_request_target exposes repository secrets (warehouse credentials) while
        # now executing code from the PR, which may come from a fork. Require manual approval
        # from a maintainer via a protected GitHub Environment before any PR code runs with
        # those secrets. Reviewers MUST check the PR's head commit before approving.
        # Only applies to PRs; pushes to main and manual dispatches are already trusted.
        # NOTE: the `cloud-tests` environment must be configured with "Required reviewers"
        # in the repo settings (Settings > Environments). Without that it does not gate anything.
        environment: ${{ github.event_name == 'pull_request_target' && 'cloud-tests' || '' }}
        # pull_request_target runs in the context of the base branch, so `github.ref` is `main`
        # and the reusable workflow would otherwise check out and test `main` instead of the PR.
        # Test the PR's head commit instead. Empty for push/workflow_dispatch, which then fall
        # back to `github.ref` in the reusable workflow.
        # Fixes https://github.com/dbt-labs/dbt-utils/issues/1105
        ref: ${{ github.event.pull_request.head.sha }}
        # no need to pass postgres vars in.  We can just use the defaults in the local container
        # redshift
        REDSHIFT_HOST: ${{ vars.REDSHIFT_HOST }}
        REDSHIFT_USER: ${{ vars.REDSHIFT_USER }}
        REDSHIFT_DATABASE: ${{ vars.REDSHIFT_DATABASE }}
        REDSHIFT_SCHEMA: "dbt_utils_integration_tests_redshift_${{ github.run_number }}"
        REDSHIFT_PORT: 5439
        # bigquery
        BIGQUERY_PROJECT: ${{ vars.BIGQUERY_PROJECT }}
        BIGQUERY_SCHEMA: "dbt_utils_integration_tests_bigquery_${{ github.run_number }}"
        # snowflake
        SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
        SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
        SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
        SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
        SNOWFLAKE_SCHEMA: "dbt_utils_integration_tests_snowflake_${{ github.run_number }}"
      secrets:
        DBT_ENV_SECRET_REDSHIFT_PASS: ${{ secrets.REDSHIFT_PASS }}
        BIGQUERY_KEYFILE_JSON: ${{ secrets.BIGQUERY_KEYFILE_JSON }}
        SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        DBT_ENV_SECRET_SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        DBT_ENV_SECRET_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
