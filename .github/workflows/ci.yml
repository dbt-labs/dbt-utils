# **what?**
# Run tests for dbt-utils against supported adapters

# **why?**
# To ensure that dbt-utils works as expected with all supported adapters

# **when?**
# On every PR, and every push to main and when manually triggered

name: Package Integration Tests

# Automatic triggers temporarily disabled while investigating https://github.com/dbt-labs/dbt-utils/issues/1105
# TODO: uncomment the push and pull_request_target triggers to re-enable integration tests once the root cause is fixed
on:
    # push:
    #     branches:
    #         - main
    # pull_request_target:
    workflow_dispatch:


env:
  CI_LABEL: "ci:approve-public-fork-ci"

jobs:
  check-run-approval:
    # Job-level `if` cannot read `env`, so the label is spelled out here.
    if: >-
      github.event.action != 'labeled'
      || (github.event.label.name == 'ci:approve-public-fork-ci'
          && github.event.pull_request.head.repo.full_name != github.repository)
    permissions:
      pull-requests: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: "If the event is to synchronize, remove the label from the PR"
        if: ${{ github.event_name == 'pull_request_target' && (github.event.action == 'synchronize' || github.event.action == 'reopened') && github.event.pull_request.head.repo.full_name != github.repository && contains(github.event.pull_request.labels.*.name, env.CI_LABEL) }}
        run: |
          echo "Synchronizing PR, removing '${{ env.CI_LABEL }}' label"
          gh pr edit ${{ github.event.pull_request.number }} --remove-label ${{ env.CI_LABEL }} --repo ${{ github.repository }}
          msg="All pull request updates require re-approval of CI. No CI will be run."
          echo "::error::$msg"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Check that forks have the '${{ env.CI_LABEL }}' label"
        if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && !contains(github.event.pull_request.labels.*.name, env.CI_LABEL) }}
        run: |
          msg="Pull request is from a public fork but does not have the '${{ env.CI_LABEL }}' label. No CI will be run."
          echo "::error::$msg"
          exit 1

  run-tests:
      needs: check-run-approval
      uses: dbt-labs/dbt-package-testing/.github/workflows/run_tox.yml@v2
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        # no need to pass postgres vars in.  We can just use the defaults in the local container
        # redshift
        REDSHIFT_HOST: ${{ vars.REDSHIFT_HOST }}
        REDSHIFT_USER: ${{ vars.REDSHIFT_USER }}
        REDSHIFT_DATABASE: ${{ vars.REDSHIFT_DATABASE }}
        REDSHIFT_SCHEMA: "dbt_utils_integration_tests_redshift_${{ github.run_number }}"
        REDSHIFT_PORT: 5439
        # bigquery
        BIGQUERY_PROJECT: ${{ vars.BIGQUERY_PROJECT }}
        BIGQUERY_SCHEMA: "dbt_utils_integration_tests_bigquery_${{ github.run_number }}"
        # snowflake
        SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
        SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
        SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
        SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
        SNOWFLAKE_SCHEMA: "dbt_utils_integration_tests_snowflake_${{ github.run_number }}"
      secrets:
        DBT_ENV_SECRET_REDSHIFT_PASS: ${{ secrets.REDSHIFT_PASS }}
        BIGQUERY_KEYFILE_JSON: ${{ secrets.BIGQUERY_KEYFILE_JSON }}
        SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        DBT_ENV_SECRET_SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        DBT_ENV_SECRET_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
